<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calorie Counter</title>
<meta name="description" content="Daily calorie counter against your own target, with a database of UK foods.">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calories">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --card-2: #f6f7f9; --border: #e5e7eb; --border-strong: #d1d5db;
    --text: #111827; --muted: #6b7280; --subtle: #9ca3af; --accent: #16a34a; --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --card-2: #1e222b; --border: #2a2f3a; --border-strong: #3a4150;
      --text: #f3f4f6; --muted: #9ca3af; --subtle: #6b7280; --accent: #22c55e; --shadow-sm: none;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 18px 16px 4px; max-width: 1100px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; }
  main { padding: 8px 16px 40px; max-width: 1100px; margin: 0 auto; }
  .top-bar { display: flex; }
  table { border-collapse: collapse; }
  td { border-top: 1px solid var(--border); }
  input, select, button { font-size: 16px !important; } /* stops iPhone zooming into fields */
</style>
</head>
<body>
<header><h1>🍎 Calorie Counter</h1></header>
<main id="app"></main>
<script src="calories.js"></script>
<script>
  Calories.mount(document.getElementById('app'));
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
